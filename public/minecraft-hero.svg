<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Minecraft tips hero background</title>
  <desc id="d">Blocky sky background with pixel clouds, a grass and dirt strip, a pixel tree and a cyan diamond. No text.</desc>

  <!-- Sky -->
  <rect x="0" y="0" width="1200" height="420" fill="#7EC0EE"/>

  <!-- Pixel clouds -->
  <g fill="#FFFFFF">
    <rect x="110" y="90" width="120" height="30"/><rect x="130" y="72" width="70" height="20"/>
    <rect x="930" y="60" width="150" height="34"/><rect x="955" y="40" width="90" height="22"/>
    <rect x="1010" y="150" width="90" height="24"/>
    <rect x="440" y="48" width="100" height="24"/><rect x="458" y="34" width="60" height="16"/>
  </g>

  <!-- Ground: grass, dirt, shadow -->
  <rect x="0" y="400" width="1200" height="24" fill="#5D9B2E"/>
  <rect x="0" y="424" width="1200" height="136" fill="#8B5A2B"/>
  <g fill="#6E4422">
    <rect x="60" y="450" width="24" height="16"/><rect x="250" y="490" width="30" height="18"/>
    <rect x="520" y="462" width="22" height="14"/><rect x="760" y="520" width="28" height="18"/>
    <rect x="1080" y="470" width="26" height="16"/><rect x="380" y="530" width="24" height="14"/>
  </g>
  <rect x="0" y="424" width="1200" height="6" fill="#4E8A2A"/>

  <!-- Pixel tree on the right -->
  <rect x="1018" y="300" width="22" height="104" fill="#9C7340"/>
  <rect x="1000" y="250" width="58" height="52" fill="#4E8A2A"/>
  <rect x="990" y="210" width="78" height="46" fill="#5D9B2E"/>
  <rect x="1008" y="182" width="42" height="34" fill="#6DB33F"/>

  <!-- Pixel diamond on the left -->
  <rect x="120" y="360" width="56" height="56" fill="#4AEDD9" stroke="#1B1B1B" stroke-width="4"/>
  <rect x="130" y="370" width="16" height="16" fill="#B4FFF4"/>
  <rect x="150" y="386" width="16" height="16" fill="#2BBFAE"/>

  <!-- Frame -->
  <rect x="4" y="4" width="1192" height="552" fill="none" stroke="#1B1B1B" stroke-width="8"/>
</svg>
