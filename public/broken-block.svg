<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Broken Minecraft-style block</title>
  <!-- main block: grass top, dirt bottom -->
  <rect x="40" y="60" width="100" height="50" fill="#5D9B2E" stroke="#1B1B1B" stroke-width="4"/>
  <rect x="40" y="110" width="100" height="50" fill="#8B5A2B" stroke="#1B1B1B" stroke-width="4"/>
  <!-- cracks -->
  <polyline points="78,60 86,82 72,96 88,118 80,160" fill="none" stroke="#1B1B1B" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="110,60 104,80 116,100" fill="none" stroke="#1B1B1B" stroke-width="3" stroke-linejoin="round"/>
  <!-- pieces breaking off -->
  <rect x="150" y="36" width="28" height="28" fill="#5D9B2E" stroke="#1B1B1B" stroke-width="3" transform="rotate(12 164 50)"/>
  <rect x="18" y="142" width="22" height="22" fill="#8B5A2B" stroke="#1B1B1B" stroke-width="3" transform="rotate(-10 29 153)"/>
  <!-- small debris -->
  <rect x="152" y="100" width="8" height="8" fill="#8B5A2B"/>
  <rect x="168" y="124" width="6" height="6" fill="#5D9B2E"/>
  <rect x="136" y="164" width="8" height="8" fill="#8B5A2B"/>
</svg>
