<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Diamond Ore - more cartoony 2D style -->
  <rect width="16" height="16" fill="#7A7A7A"/>
  
  <!-- soft stone patches -->
  <rect x="0" y="0" width="7" height="5" fill="#8B8B8B"/>
  <rect x="9" y="1" width="7" height="5" fill="#6B6B6B"/>
  <rect x="1" y="8" width="6" height="5" fill="#8B8B8B"/>
  <rect x="9" y="9" width="6" height="5" fill="#6B6B6B"/>
  
  <!-- big cartoony diamonds -->
  <!-- top left -->
  <rect x="2" y="2" width="4" height="3" fill="#44DDFF"/>
  <rect x="3" y="1" width="2" height="1" fill="#AAF0FF"/>
  <rect x="3" y="3" width="2" height="1" fill="#22BBEE"/>
  
  <!-- top right -->
  <rect x="10" y="3" width="4" height="3" fill="#44DDFF"/>
  <rect x="11" y="2" width="2" height="1" fill="#AAF0FF"/>
  <rect x="11" y="4" width="2" height="1" fill="#22BBEE"/>
  
  <!-- bottom left -->
  <rect x="3" y="10" width="4" height="3" fill="#44DDFF"/>
  <rect x="4" y="9" width="2" height="1" fill="#AAF0FF"/>
  <rect x="4" y="11" width="2" height="1" fill="#22BBEE"/>
  
  <!-- bottom right -->
  <rect x="9" y="9" width="4" height="3" fill="#44DDFF"/>
  <rect x="10" y="8" width="2" height="1" fill="#AAF0FF"/>
  <rect x="10" y="10" width="2" height="1" fill="#22BBEE"/>
  
  <!-- center sparkle -->
  <rect x="7" y="6" width="2" height="2" fill="#88EEFF"/>
  <rect x="7" y="5" width="2" height="1" fill="#FFFFFF"/>
</svg>
