<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Mob Spawner - full cartoony Creeper face -->
  <rect width="16" height="16" fill="#1A1A1A"/>
  
  <!-- thick outer cage frame -->
  <rect x="0" y="0" width="16" height="2" fill="#3A3A3A"/>
  <rect x="0" y="14" width="16" height="2" fill="#3A3A3A"/>
  <rect x="0" y="0" width="2" height="16" fill="#3A3A3A"/>
  <rect x="14" y="0" width="2" height="16" fill="#3A3A3A"/>
  
  <!-- inner dark background -->
  <rect x="2" y="2" width="12" height="12" fill="#111111"/>
  
  <!-- cage bars (thinner so face shows better) -->
  <rect x="5" y="2" width="1" height="12" fill="#555555"/>
  <rect x="10" y="2" width="1" height="12" fill="#555555"/>
  <rect x="2" y="5" width="12" height="1" fill="#555555"/>
  <rect x="2" y="10" width="12" height="1" fill="#555555"/>
  
  <!-- ===== FULL CARTOONY CREEPER FACE ===== -->
  <!-- face base (bright green) -->
  <rect x="3" y="3" width="10" height="10" fill="#55BB55"/>
  
  <!-- left eye -->
  <rect x="4" y="5" width="3" height="3" fill="#111111"/>
  <!-- right eye -->
  <rect x="9" y="5" width="3" height="3" fill="#111111"/>
  
  <!-- classic creeper mouth -->
  <rect x="6" y="9" width="4" height="1" fill="#111111"/>
  <rect x="5" y="10" width="1" height="2" fill="#111111"/>
  <rect x="10" y="10" width="1" height="2" fill="#111111"/>
  <rect x="6" y="11" width="1" height="1" fill="#111111"/>
  <rect x="9" y="11" width="1" height="1" fill="#111111"/>
  
  <!-- subtle highlight on face -->
  <rect x="3" y="3" width="10" height="1" fill="#77DD77"/>
  <rect x="3" y="3" width="1" height="10" fill="#77DD77"/>
  
  <!-- corner bolts -->
  <rect x="1" y="1" width="1" height="1" fill="#888888"/>
  <rect x="14" y="1" width="1" height="1" fill="#888888"/>
  <rect x="1" y="14" width="1" height="1" fill="#888888"/>
  <rect x="14" y="14" width="1" height="1" fill="#888888"/>
</svg>
