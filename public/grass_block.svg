  <rect x="0" y="2" width="16" height="1" fill="#4A7A30"/>
  <!-- Dirt body -->
  <rect x="0" y="3" width="16" height="13" fill="#866043"/>
  <rect x="0" y="3" width="4" height="3" fill="#6B4F2F"/>
  <rect x="5" y="3" width="3" height="2" fill="#9A7048"/>
